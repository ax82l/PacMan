name: Decompile APK

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O apktool.jar
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q jadx-1.5.0.zip -d jadx

      - name: Download APK from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo ${{ github.repository }} --pattern "app.apk"

      - name: Decompile
        run: |
          java -jar apktool.jar d app.apk -o apktool_out -f
          jadx/bin/jadx -d jadx_out app.apk || true

      - name: Build report
        run: |
          {
            echo "=== lib/ contents ==="
            echo "=== assets ==="; ls -la apktool_out/assets 2>/dev/null; find apktool_out -size +5M -type f -exec ls -la {} \;
            ls -R apktool_out/lib 2>/dev/null || echo "no lib/ folder"
            echo
            echo "=== files mentioning ghost logic ==="
            grep -rliE "blinky|pinky|inky|clyde|scatter|chase|frighten" jadx_out/sources apktool_out/smali* 2>/dev/null | head -50
          } > report.txt
          cat report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: decompiled
          path: |
            report.txt
            jadx_out/sources
