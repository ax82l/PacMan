name: Export GML code

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from latest PacMan release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo ${{ github.repository }} --pattern "app.apk"
          unzip -j app.apk assets/game.droid -d .
          ls -la game.droid

      - name: Download UndertaleModCli (Linux)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO=UnderminersTeam/UndertaleModTool
          echo "Assets in latest release:"
          gh release view --repo $REPO --json assets --jq '.assets[].name'
          NAME=$(gh release view --repo $REPO --json assets --jq '.assets[].name' | grep -i cli | grep -iE 'ubuntu|linux' | head -1)
          echo "Chosen: $NAME"
          gh release download --repo $REPO --pattern "$NAME"
          mkdir cli && unzip -q "$NAME" -d cli
          chmod +x cli/UndertaleModCli
          ls cli | head -30

      - name: Show CLI help
        run: |
          ./cli/UndertaleModCli --help || true
          echo ------
          ./cli/UndertaleModCli dump --help || true

      - name: Dump code
        run: |
          mkdir -p code_out
          ./cli/UndertaleModCli dump game.droid --code -o code_out || ./cli/UndertaleModCli dump game.droid -c -o code_out || true
          echo "Files dumped:"; find code_out -type f | wc -l

      - name: Build report
        run: |
          {
            echo "=== dumped files ==="; find code_out -type f | wc -l
            echo "=== files mentioning ghosts ==="
            grep -rliE "blinky|pinky|inky|clyde|scatter|chase|frighten" code_out 2>/dev/null | head -60
          } > report2.txt
          cat report2.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gml_code
          path: |
            report2.txt
            code_out
